version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: viet_disaster_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  certbot:
    image: certbot/certbot
    container_name: viet_disaster_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  db:
    image: postgres:15-alpine
    container_name: viet_disaster_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password_change_me}
      - POSTGRES_DB=${DB_NAME:-viet_disaster}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: viet_disaster_redis
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: 
      context: ./backend
    container_name: viet_disaster_backend
    restart: always
    environment:
      - APP_DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password_change_me}@db:5432/${DB_NAME:-viet_disaster}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your_production_secret_key_change_me}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-https://example.com}
      - RUN_SCHEDULER=false
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: 
      context: ./backend
    container_name: viet_disaster_worker
    restart: always
    environment:
      - APP_DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password_change_me}@db:5432/${DB_NAME:-viet_disaster}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your_production_secret_key_change_me}
      - RUN_SCHEDULER=true
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.main"] # Run directly to avoid multi-worker scheduler
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE= # Empty forces same-origin relative paths, ideal for Nginx proxy
    container_name: viet_disaster_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  db-backup:
    image: postgres:15-alpine
    container_name: viet_disaster_backup
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password_change_me}
      - POSTGRES_DB=${DB_NAME:-viet_disaster}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/backup.sh:ro
    command: >
      sh -c "chmod +x /backup.sh && 
             while true; do
               /backup.sh;
               echo 'Next backup in 24 hours...';
               sleep 86400;
             done"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  db_data:
  backend_data:
  backend_logs:
  redis_data:

