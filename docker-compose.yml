services:
  db:
    image: postgres:15-alpine
    container_name: viet_disaster_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_password_dev}
      - POSTGRES_DB=${DB_NAME:-viet_disaster}
    # Using volumes for persistence in dev
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viet_disaster_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: viet_disaster_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend_data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - APP_DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password_dev}@db:5432/${DB_NAME:-viet_disaster}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_123}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@123456}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:18-alpine
    container_name: viet_disaster_frontend
    restart: always
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
