version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: viet_disaster_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-12102004}
      - POSTGRES_DB=${DB_NAME:-postgres}
    # No ports exposed - only accessible within Docker network
    volumes:
      - ./db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: viet_disaster_redis
    restart: always
    # No ports exposed - only accessible within Docker network

  backend:
    build: 
      context: ./backend
    container_name: viet_disaster_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend_data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - APP_DB_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-12102004}@db:5432/${DB_NAME:-postgres}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis


  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=
    container_name: viet_disaster_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  db_data:
